services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    environment:
      MODELS_DIR: /models
    volumes:
      - ./models:/models:ro
    environment:
      MODELS_DIR: /models
      TILES_DIR: /data/tiles
    volumes:
      - ./models:/models:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [api]